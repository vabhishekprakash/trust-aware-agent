name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies (CPU PyTorch)
        run: pip install -r requirements.txt
      - name: Install the package
        run: pip install -e . --no-deps
      - name: Tests
        run: pytest
